<!DOCTYPE html>
<html lang="he">
	<head>
		<meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>מעונות בסמח | {% block title %}{% endblock %}</title>
        <!-- Style was taken from https://bootswatch.com/minty/ -->
        <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/bsmch-logo.png') }}">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.14.0-beta2/css/bootstrap-select.min.css" />
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    </head>
	</head>
	<body>
		<nav class="navbar navbar-expand-lg bg-primary fixed-top card-text-right" data-bs-theme="dark">
			<div class="container">
				<a href="{{ url_for('home') }}" class="navbar-brand">
					<img src="{{ url_for('static', filename='images/bsmch-logo.png') }}" height="40px">
				</a>
				<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="'navbarResponsive'" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarResponsive">
					<!-- Navigation bar -->
					<ul class="navbar-nav ms-auto d-flex">
						<li class="nav-item {{ 'active' if active_page == 'home' else '' }}">
							<a href="{{ url_for('home') }}" class="nav-link card-text-right">דף הבית</a>
						</li>
						<li class="nav-item {{ 'active' if active_page == 'residents' else '' }}">
							<a href="{{ url_for('residents') }}" class="nav-link card-text-right">מתגוררים</a>
						</li>
					</ul>
					<!-- Navigation bar -->
					<a href="{{ url_for('login') }}" class="btn card-text-left {{ 'd-none' if session.get('logged_in') else ''}}">התחברות</a>
					<a href="{{ url_for('logout') }}" class="btn btn-secondary card-text-left {{ 'd-none' if active_page == 'login' else ''}} {{ 'd-none' if not session.get('logged_in') else ''}}">התנתקות</a>
				</div>
			</div>
		</nav>
		<div class="container">
		</br>
			</br> {% block content %}{% endblock %} </div>
    	</div>
		
		<script src="{{ url_for('static', filename='js/script.js') }}"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.14.0-beta2/js/bootstrap-select.min.js"></script>
	</body>
</html>
