<!DOCTYPE html>
<html lang="he">
	<head>
		<meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>מעונות בסמח | {% block title %}{% endblock %}</title>
        <!-- Style was taken from https://bootswatch.com/minty/ -->
        <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/bsmch-logo.png') }}">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.14.0-beta2/css/bootstrap-select.min.css" />
        <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.3.0/css/datepicker.css" rel="stylesheet" type="text/css" />
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    </head>
	</head>
	<body>
		<nav class="navbar navbar-expand-lg bg-primary fixed-top" data-bs-theme="dark">
			<div class="container">
				<a href="{{ url_for('home') }}" class="navbar-brand">
					<img src="{{ url_for('static', filename='images/bsmch-logo.png') }}" height="40px">
				</a>
				<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="'navbarResponsive'" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarResponsive">
					<!-- Navigation bar -->
					<ul class="navbar-nav me-auto">
						<li class="nav-item {{ 'active' if active_page == 'home' else '' }}">
							<a href="{{ url_for('home') }}" class="nav-link">בית</a>
						</li>
						<li class="nav-item {{ 'active' if active_page == 'residents' else '' }}">
							<a href="{{ url_for('residents') }}" class="nav-link">מתגוררים</a>
						</li>
					</ul>
					<!-- Navigation bar -->
					<!-- Search form -->
					<form class="d-flex">
						<input class="form-control me-sm-2" type="search" placeholder="Search">
						<button class="btn btn-secondary my-2 my-sm-0" type="submit">Search</button>
					</form>
					<!-- Search Form -->
				</div>
			</div>
		</nav>
		<div class="container">
		</br>
			</br> {% block content %}{% endblock %} </div>
    	</div>
		
		<script src="{{ url_for('static', filename='js/script.js') }}"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.14.0-beta2/js/bootstrap-select.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.3.0/js/bootstrap-datepicker.js"></script>
	</body>
</html>
